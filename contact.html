<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkeds | Iniciar Proyecto</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            accent: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-bg {
            box-shadow: 0 0 80px -10px rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-full flex flex-col justify-between relative overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <!-- Ambient Background Lights -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-600/20 rounded-full blur-[130px] -z-10 pointer-events-none"></div>
    <div class="fixed bottom-10 right-10 w-[300px] h-[300px] bg-brand-accent/15 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

    <!-- Header Minimalista -->
    <header class="w-full py-8 px-6 text-center">
        <a href="#" class="inline-flex items-center gap-3 group">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-accent flex items-center justify-center text-white font-extrabold text-2xl shadow-lg group-hover:scale-105 transition-transform duration-300">
                M
            </div>
            <span class="text-3xl font-black tracking-tight text-white">Monkeds<span class="text-brand-accent">.</span></span>
        </a>
    </header>

    <!-- Main Content / Form Container -->
    <main class="w-full max-w-4xl mx-auto px-6 py-6 my-auto">
        
        <!-- Heading -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-card border border-brand-500/30 text-brand-accent text-xs font-bold tracking-widest uppercase mb-4">
                <span class="w-2 h-2 rounded-full bg-brand-accent animate-pulse"></span>
                Inicia Tu Comisión Personalizada
            </div>
            <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-4">
                ¿Qué figura o proyecto vamos a <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 via-brand-accent to-indigo-300">crear juntos?</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base max-w-lg mx-auto">
                Cuéntanos los detalles de tu figura, prototipo o colección. En <strong>Monkeds</strong> le daremos vida a tu idea con impresión 3D y acabado profesional.
            </p>
        </div>

        <!-- Form Box -->
        <div class="glass-card rounded-3xl p-6 md:p-10 glow-bg">
            <form action="#" method="POST" class="space-y-6">
                
                <!-- Datos Personales (Grid 2 columnas) -->
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Nombre -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                            Tu Nombre / Empresa <span class="text-brand-accent">*</span>
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input type="text" required placeholder="Ej. Juan Pérez o Mi Marca" class="w-full bg-slate-900/80 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-sm">
                        </div>>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                            Correo Electrónico <span class="text-brand-accent">*</span>
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input type="email" required placeholder="tu@correo.com" class="w-full bg-slate-900/80 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-sm">
                        </div>
                    </div>
                </div>

                <!-- WhatsApp / Teléfono & Servicio Requerido -->
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- WhatsApp -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                            WhatsApp / Teléfono
                        </label>
                        <div class="relative">
                            <i class="fa-brands fa-whatsapp absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input type="tel" placeholder="+51 987 654 321" class="w-full bg-slate-900/80 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-sm">
                        </div>
                    </div>

                    <!-- Tipo de Servicio -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                            Servicio Requerido <span class="text-brand-accent">*</span>
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-cube absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm pointer-events-none"></i>
                            <select required class="w-full bg-slate-900/80 border border-white/10 rounded-xl pl-11 pr-10 py-3.5 text-slate-500 focus:text-slate-200 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-sm appearance-none cursor-pointer" onchange="this.classList.remove('text-slate-500'); this.classList.add('text-slate-200');">
                                <option value="" disabled selected hidden>Selecciona un servicio...</option>
                                <option value="figuras_geek" class="bg-slate-900 text-slate-200">🦸 Figura / Coleccionable Geek Personalizado</option>
                                <option value="impresion_resina" class="bg-slate-900 text-slate-200">🖨️ Impresión 3D en Resina de Alta Definición</option>
                                <option value="pintado_profesional" class="bg-slate-900 text-slate-200">🎨 Pintado Profesional a Mano</option>
                                <option value="diseno_escultura3d" class="bg-slate-900 text-slate-200">🖥️ Modelado / Escultura Digital 3D</option>
                                <option value="prototipado" class="bg-slate-900 text-slate-200">⚙️ Prototipado Técnico / Piezas Especiales</option>
                                <option value="otro" class="bg-slate-900 text-slate-200">💡 Otro Trabajo a Pedido</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <!-- Mensaje / Detalles -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                        Cuéntanos sobre tu proyecto <span class="text-brand-accent">*</span>
                    </label>
                    <textarea rows="4" required placeholder="Cuéntanos personaje, escala/tamaño deseado, si cuentas con el archivo 3D (.STL) o si necesitas pintado a mano..." class="w-full bg-slate-900/80 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all text-sm resize-none"></textarea>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="w-full group bg-gradient-to-r from-brand-600 via-indigo-600 to-brand-accent hover:opacity-95 text-white font-bold py-4 rounded-xl transition-all duration-300 shadow-lg shadow-brand-500/25 flex items-center justify-center gap-3">
                    <span class="text-base tracking-wide">Enviar Solicitud a Monkeds</span>
                    <i class="fa-solid fa-paper-plane text-sm group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-slate-500">
        <p>&copy; Monkeds. Pe - Lima, Perú. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
