<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkeds - Próximamente</title>
    <!-- Incluir fuentes de Google, por ejemplo, Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0; /* Color de fondo gris claro */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            background-color: #4CAF50; /* Color verde para la barra de progreso */
            width: 75%; /* Progreso simulado al 75% */
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }

        .notify-button {
            background-color: #337ab7;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .notify-button:hover {
            background-color: #2e6da4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Monkeds</div>
        <div class="subtitle">Próximamente</div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <a href="#" class="notify-button">Notifícame</a>
    </div>
</body>
</html>
