<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Construcción | monkedsperu</title>

    <!-- Fuente Inter y FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* =========================================================
           1. VARIABLES Y PALETA DE COLORES
           ========================================================= */
        :root {
            --bg-white: #ffffff;
            --carbon-dark: #111111;
            --carbon-medium: #333333;
            --carbon-light: #666666;
            --carbon-border: #d0d7de;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================================
           2. RESET & ESTILOS BASE
           ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-white);
            color: var(--carbon-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================================
           3. MARCA DE AGUA (LOGOTIPO VISIBLE Y NOTABLE)
           ========================================================= */
        body::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            height: 85vh;
            background-image: url('logo_y_nombre.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.22; /* Aumentamos visibilidad sin perder elegancia */
            z-index: 0;
            pointer-events: none;
        }

        /* =========================================================
           4. HEADER & NAV
           ========================================================= */
        header {
            position: relative;
            z-index: 10;
            padding: 2.5rem 8%;
            display: flex;
            justify-content: flex-end;
        }

        .nav-link {
            text-decoration: none;
            color: var(--carbon-dark);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            position: relative;
            padding-bottom: 4px;
            transition: var(--transition-smooth);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--carbon-dark);
            transition: var(--transition-smooth);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* =========================================================
           5. TARJETA CRISTALINA (PERMITE VER EL MONO DETRÁS)
           ========================================================= */
        main {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 5%;
            flex-grow: 1;
        }

        .hero-card {
            /* Vidrio semi-transparente para apreciar el dibujo */
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(17, 17, 17, 0.12);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-title {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: var(--carbon-dark);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--carbon-medium);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        /* =========================================================
           6. BARRA DE PROGRESO CON MAYOR VISIBILIDAD
           ========================================================= */
        .progress-box {
            width: 100%;
            max-width: 360px;
            margin: 0 auto 2.5rem auto;
        }

        .progress-track {
            height: 5px;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 65%;
            background: var(--carbon-dark);
            border-radius: 10px;
            animation: progressAnim 2s ease-out forwards;
        }

        @keyframes progressAnim {
            from { width: 0%; }
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--carbon-dark);
        }

        /* =========================================================
           7. BOTÓN DE NOTIFICACIÓN
           ========================================================= */
        .btn-notify {
            display: inline-block;
            background-color: var(--carbon-dark);
            color: var(--bg-white);
            text-decoration: none;
            padding: 1rem 2.8rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            border: 2px solid var(--carbon-dark);
            box-shadow: 0 10px 20px -5px rgba(17, 17, 17, 0.3);
            transition: var(--transition-smooth);
        }

        .btn-notify:hover {
            background-color: transparent;
            color: var(--carbon-dark);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(17, 17, 17, 0.2);
        }

        /* =========================================================
           8. REDES SOCIALES
           ========================================================= */
        footer {
            position: relative;
            z-index: 10;
            padding: 2.5rem 5%;
            text-align: center;
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .social-card {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(17, 17, 17, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--carbon-dark);
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: var(--transition-smooth);
        }

        .social-card:hover {
            background-color: var(--carbon-dark);
            color: var(--bg-white);
            border-color: var(--carbon-dark);
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .copyright-text {
            font-size: 0.85rem;
            color: var(--carbon-medium);
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .hero-card { padding: 2.5rem 1.5rem; }
            .main-title { font-size: 2.2rem; }
            body::before { width: 95vw; opacity: 0.25; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="nav-link">Home</a>
    </header>

    <main>
        <div class="hero-card">
            <h1 class="main-title">Under<br>Construction</h1>
            <p class="subtitle">Site nearly ready</p>

            <div class="progress-box">
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span>0%</span>
                    <span>100%</span>
                </div>
            </div>

            <a href="mailto:contacto@monkeds.com" class="btn-notify">Notify Me!</a>
        </div>
    </main>

    <footer>
        <div class="social-container">
            <a href="#" target="_blank" class="social-card" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" target="_blank" class="social-card" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" class="social-card" title="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="#" target="_blank" class="social-card" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright-text">© 2026 by monkedsperu. Proudly hosted on GitHub Pages.</p>
    </footer>

</body>
</html>
