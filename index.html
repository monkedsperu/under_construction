<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Construcción | Próximamente</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem 2rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .contact-btn {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .contact-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Sitio en desarrollo</div>
        <div class="icon">🚀</div>
        <h1>¡Estamos trabajando en algo genial!</h1>
        <p>Nuestro sitio web se encuentra actualmente en construcción. Regresa muy pronto para descubrir todas las novedades que tenemos preparadas.</p>
        
        <!-- Cambia el correo por el tuyo -->
        <a href="mailto:tu-correo@ejemplo.com" class="contact-btn">Contacto por Email</a>
    </div>

</body>
</html>
