<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkeds - Próximamente</title>

    <!-- Fuente Inter y FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --bg-white: #ffffff;
            --carbon-dark: #000000;
            --carbon-medium: #555555;
            --carbon-light: #888888;
            --carbon-border: #e0e0e0;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --transition-smooth: all 0.25s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-white);
            color: var(--carbon-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- CONTENEDOR CENTRAL --- */
        main {
            width: 100%;
            max-width: 950px;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 360px 1fr;
            align-items: center;
            gap: 3.5rem;
            margin: auto 0;
        }

        /* COLUMNA IZQUIERDA: LOGO */
        .left-column {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-logo {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* COLUMNA DERECHA: TEXTO Y BARRA */
        .right-column {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .main-title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.03em;
            color: var(--carbon-dark);
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--carbon-medium);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 1.8rem;
        }

        /* BARRA DE PROGRESO */
        .progress-box {
            width: 100%;
            max-width: 320px;
        }

        .progress-track {
            height: 4px;
            background-color: var(--carbon-border);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 50%;
            background-color: var(--carbon-dark);
            border-radius: 10px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 0.6rem;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--carbon-dark);
        }

        /* --- FOOTER Y REDES SOCIALES --- */
        footer {
            width: 100%;
            padding: 2.5rem 5%;
            text-align: center;
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }

        .social-card {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 1px solid var(--carbon-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--carbon-dark);
            text-decoration: none;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }

        .social-card:hover {
            background-color: var(--carbon-dark);
            color: #ffffff;
            border-color: var(--carbon-dark);
            transform: translateY(-2px);
        }

        .copyright-text {
            font-size: 0.75rem;
            color: var(--carbon-light);
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 800px) {
            main {
                grid-template-columns: 1fr;
                gap: 2rem;
                text-align: center;
            }

            .right-column {
                align-items: center;
                text-align: center;
            }

            .main-title { font-size: 2.5rem; }
            .hero-logo { max-width: 280px; }
        }
    </style>
</head>
<body>

    <main>
        <!-- Lado Izquierdo: Logo completo Monkeds -->
        <div class="left-column">
            <img src="logo_y_nombre.svg" alt="Monkeds Logo" class="hero-logo">
        </div>

        <!-- Lado Derecho: Información exacta -->
        <div class="right-column">
            <h1 class="main-title">PROXIMAMENTE</h1>
            <p class="subtitle">EN CONSTRUCCIÓN</p>

            <div class="progress-box">
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span>0%</span>
                    <span>100%</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-container">
            <a href="#" target="_blank" class="social-card" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" target="_blank" class="social-card" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" class="social-card" title="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="#" target="_blank" class="social-card" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright-text">© 2026 by monkedsperu. Proudly hosted on GitHub Pages.</p>
    </footer>

</body>
</html>
