<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkeds - En Construcción</title>

    
    <meta name="description" content="Monkeds - Próximamente sitio web oficial. Arte, diseño y escultura digital.">
    <meta property="og:title" content="Monkeds - Under Construction">
    <meta property="og:description" content="Próximamente sitio web oficial.">
    <meta property="og:image" content="logo_y_nombre.svg">
    <link rel="icon" type="image/svg+xml" href="logo_y_nombre.svg">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --bg-white: #ffffff;
            --carbon-dark: #000000;
            --carbon-medium: #555555;
            --carbon-light: #888888;
            --carbon-border: #e0e0e0;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --transition-smooth: all 0.25s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-white);
            color: var(--carbon-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }


        main {
            width: 100%;
            max-width: 950px;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 360px auto;
            align-items: center;
            gap: 3.5rem;
            margin: auto 0;
        }


        .left-column {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-logo {
            width: 100%;
            height: auto;
            object-fit: contain;
        }


        .right-column {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            width: fit-content; 
        }

        .main-title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.03em;
            color: var(--carbon-dark);
            text-transform: uppercase;
            margin-bottom: 1.2rem;
            white-space: nowrap;
            margin-top: 1em;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--carbon-medium);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 1.8rem;
        }

       
        .progress-box {
            width: 100%; 
        }

        .progress-track {
            height: 4px;
            background-color: var(--carbon-border);
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            width: 50%;
            background-color: var(--carbon-dark);
            border-radius: 10px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 0.6rem;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--carbon-dark);
        }


        footer {
            width: 100%;
            padding: 2.5rem 5%;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }

        .social-links a {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 1px solid var(--carbon-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--carbon-dark);
            text-decoration: none;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }

        .social-links a:hover {
            background-color: var(--carbon-dark);
            color: #ffffff;
            border-color: var(--carbon-dark);
            transform: translateY(-2px);
        }

        .copyright-text {
            font-size: 0.75rem;
            color: var(--carbon-light);
            font-weight: 500;
        }

        @media (max-width: 800px) {
            main {
                grid-template-columns: 1fr;
                justify-items: center;
                gap: 2rem;
                text-align: center;
            }

            .right-column {
                align-items: center;
                text-align: center;
                width: 100%;
            }

            .main-title { 
                font-size: 2.5rem; 
                white-space: normal;
            }
            .hero-logo { max-width: 280px; }

            .progress-box {
                max-width: 380px;
            }
        }
    </style>
</head>
<body>

    <main>
        
        <div class="left-column">
            <img src="logo_y_nombre.svg" alt="Monkeds Logo" class="hero-logo">
        </div>

        
        <div class="right-column">
            <h1 class="main-title">En construcción</h1>

            <div class="progress-box">
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span>0%</span>
                    <span>100%</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            
            <a href="https://www.facebook.com/monkedspe" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-facebook-f"></i>
            </a>

            
            <a href="https://www.instagram.com/monkeds.pe" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-instagram"></i>
            </a>

            
            <a href="https://www.tiktok.com/@monkeds.pe" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-tiktok"></i>
            </a>

            
            
            <a href="https://wa.me/51933005573?text=Hola,%20quisiera%20consultar%20por%20sus%20productos" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i>
            </a>
        </div>
        <p class="copyright-text">© 2026 by monkeds.</p>
    </footer>

</body>
</html>
